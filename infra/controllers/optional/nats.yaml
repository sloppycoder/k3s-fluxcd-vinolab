apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: infra
spec:
  interval: 72h
  url: https://nats-io.github.io/k8s/helm/charts/

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: infra
spec:
  interval: 24h
  chart:
    spec:
      chart: nats
      version: "2.15.2"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: infra
      interval: 12h
  values:
    config:
      cluster:
        enabled: false
        replicas: 1
      jetstream:
        enabled: true
        memoryStore:
          enabled: true
          maxSize: 512Mi
        fileStore:
          enabled: false

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nack
  namespace: infra
spec:
  interval: 24h
  chart:
    spec:
      chart: nack
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: infra
      interval: 12h
  values:
    jetstream:
      nats:
        url: nats://nats:4222
