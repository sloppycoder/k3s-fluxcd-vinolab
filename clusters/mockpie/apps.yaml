# for each deployment
# we'll setup:
#   one GitRepository pointing to the git branch
#   one Kustomization using the above GitRepository

# dev env setup
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vinobank-repo-dev
  namespace: flux-system
spec:
  interval: 1m0s
  url: https://github.com/vino9net/vinobank-gitops
  ref:
    branch: develop
  secretRef:
    name: vinobank-repo-token
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-infra-test
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: vinobank-repo-dev
  path: ./infra-test/env/dev
  wait: true
  prune: true
  # The application repo still has removed Flux beta APIs. Migrate the rendered
  # test resources here and disable writes back to that external repository.
  patches:
    - target:
        group: image.toolkit.fluxcd.io
        kind: ImageUpdateAutomation
      patch: |-
        - op: replace
          path: /apiVersion
          value: image.toolkit.fluxcd.io/v1
        - op: replace
          path: /spec/suspend
          value: true
        - op: replace
          path: /spec/git/commit/messageTemplate
          value: Update infrastructure test images
    - target:
        group: image.toolkit.fluxcd.io
        kind: ImageRepository
      patch: |-
        - op: replace
          path: /apiVersion
          value: image.toolkit.fluxcd.io/v1
    - target:
        group: image.toolkit.fluxcd.io
        kind: ImagePolicy
      patch: |-
        - op: replace
          path: /apiVersion
          value: image.toolkit.fluxcd.io/v1
