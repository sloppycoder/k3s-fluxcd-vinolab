apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster-configs/mockpie/infra/controllers
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./cluster-configs/mockpie/infra/configs
  prune: true
  patches:
    # add file storage to NATS
    - patch: |
        - op: replace
          path: /spec/valuesContent/nats/fileStorage
          value:
            enabled: true
            size: 2Gi
            storageDirectory: /data/
      target:
        kind: HelmRelease
        name: nats
        namespace: infra
