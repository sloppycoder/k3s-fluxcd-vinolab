apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infra/controllers/base
  # Longhorn is retained for super6; OrbStack lacks host iSCSI prerequisites.
  - ../../../../infra/controllers/optional/cnpg
  - ../../../../infra/controllers/optional/redis-operator.yaml
  - ../../../../infra/controllers/optional/knative-serving
  - ../../../../infra/controllers/optional/knative-eventing
  - ../../../../infra/controllers/optional/metrics-server
patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
