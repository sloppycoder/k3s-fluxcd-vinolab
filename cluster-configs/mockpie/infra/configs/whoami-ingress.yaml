apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  namespace: infra
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: whoami-dev.kube.vino9.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 80
