apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../infra/configs/base
  - ../../../../infra/configs/optional/cloudflare-tunnel.yaml
  - ../../../../infra/configs/optional/gitops-repo-tokens.yaml
  - ../../../../infra/configs/optional/knative-serving
  - ../../../../infra/configs/optional/knative-eventing
  - ../../../../infra/configs/namespaces/test
# OrbStack uses different addresses from the default K3s 10.42/10.43 ranges.
patches:
  - target:
      kind: NetworkPolicy
      name: allow-dns
      namespace: test
    patch: |-
      - op: replace
        path: /spec/egress/0/to
        value:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
  - target:
      kind: NetworkPolicy
      name: allow-k8s-api-egress
      namespace: test
    patch: |-
      - op: replace
        path: /spec/egress
        value:
          - to:
              - ipBlock:
                  cidr: 192.168.194.129/32
            ports:
              - protocol: TCP
                port: 443
          - to:
              - ipBlock:
                  cidr: 192.168.139.2/32
            ports:
              - protocol: TCP
                port: 26443
  - target:
      kind: NetworkPolicy
      name: allow-cluster-external-egress
      namespace: test
    patch: |-
      - op: replace
        path: /spec/egress/0/to/0/ipBlock/except
        value:
          - 192.168.194.0/24
  - target:
      kind: ExternalSecret
      name: cloudflare-tunnel-credentials
      namespace: infra
    patch: |-
      - op: replace
        path: /spec/target/template/data/tunnel_name
        value: k3s-mockpie-dev
